name: Daily Realtor Scrape

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_realtor.py

      - name: Commit updated latest CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/virginia_housing_raw.csv
          git commit -m "Automatic daily housing update" || echo "No changes to commit"
          git push